
[package]
name = "rust_onepiece"
version = "0.0.1"
edition = "2024"
build = "./src/build.rs"

[dependencies]
actix-web = "4.11.0"
anyhow = "1.0.99"
dotenvy = "0.15.7"
env_logger = "0.11.8"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
prost = "0.14.1"
serde = "1.0.219"
serde_json = "1.0.143"
sqlx = "0.8.6"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tonic = "0.14.2"

[build-dependencies]
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
